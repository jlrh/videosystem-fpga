jtframe:
  - get:
      - jtframe_edge.v
  - from: cpu
    unless: [NOMAIN]
    get:
      - jtframe_m68k.yaml
      - jtframe_z80.yaml
  - from: ram
    get:
      - jtframe_ram.v
      - jtframe_ram16.v
      - jtframe_dual_ram.v
      - jtframe_dual_ram16.v
      - jtframe_obj_buffer.v

  - from: sound
    get:
      - jtframe_dcrm.v

